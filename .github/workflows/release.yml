name: Release

# Push a vX.Y.Z tag by hand; this drafts its GitHub Release (with this
# action, from the checkout itself) and moves the floating vX major tag so
# `uses: detextre4/deploy-records@v1` picks the new version up. The release
# stays a draft on purpose: GitHub Marketplace only lists releases published
# from the web UI with "Publish this Action to the GitHub Marketplace" ticked.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # "v1.2.0" → "1.2.0": CHANGELOG.md sections are "## [1.2.0]".
      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish release notes
        uses: ./
        with:
          version: ${{ steps.version.outputs.version }}
          tag-template-release: 'v{{version}}'
          on-existing: use
          release: 'true'
          draft: 'true'
          sections: changelog,commits
          changelog-section: version
          title: Deploy Records

      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR=${TAG%%.*}
          git tag -f "$MAJOR" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
