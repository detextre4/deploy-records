name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The action runs on whatever runner the caller picks, so the suite runs
  # on all three: macOS covers bash 3.2, Windows covers Git Bash.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The suite takes ~6 minutes on Windows. A hang after the last test (a
    # background git process keeping bats' output open) would otherwise run
    # until GitHub's 6-hour job limit.
    timeout-minutes: 15
    steps:
      # Egress audit (see "Supply-chain hardening" in the README). Linux only.
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Dev-only deps (bats): none needs an install script, so none gets to
      # run one.
      - run: npm ci --ignore-scripts
      - name: bats
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          # No detached gc/maintenance in the throwaway repos (bare remotes
          # included): a background git outliving its test keeps bats waiting.
          git config --global gc.auto 0
          git config --global gc.autoDetach false
          git config --global maintenance.auto false
          git config --global receive.autogc false
          # Straight from bash, not via npx: on Windows the npm shim hands bats a
          # "D:/..." path, which bats rejects as not absolute.
          ./node_modules/bats/bin/bats --print-output-on-failure test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25
      - name: shellcheck
        run: shellcheck -x -s bash src/main.sh src/lib/*.sh src/i18n/*.sh test/test_helper.bash test/fixtures/fake-curl
      - name: actionlint
        run: actionlint

  # Runs the action itself from this checkout, end to end, without pushing
  # anything: prepare + finalize with only the summary record on.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # tag: none below: nothing in this job pushes.
          persist-credentials: false
      - id: prepare
        uses: ./
        with:
          mode: prepare
          version: 0.0.0+${{ github.run_number }}
          platform: CI
          kind: testing
      - id: finalize
        uses: ./
        with:
          mode: finalize
          platform: CI
          tag: none
          details: |
            Runner|${{ runner.os }}
          note: Dogfood run — nothing is pushed.
      - name: Check outputs
        env:
          TAG: ${{ steps.finalize.outputs.tag }}
          NOTES: ${{ steps.finalize.outputs.notes-path }}
        run: |
          test "$TAG" = "testing-CI-v0.0.0+${{ github.run_number }}-run${{ github.run_number }}"
          grep -q '^## 🚀 CI Testing' "$NOTES"
