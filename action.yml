name: deploy-records
description: >-
  Records a deploy: resolves its version and tag, builds release notes
  (details table, CHANGELOG section, commits since the previous tag) and,
  each one optional, writes the job summary, pushes a git tag and publishes a
  GitHub Release.
author: detextre4

inputs:
  # ---------------------------------------------------------------- mode
  mode:
    description: >-
      prepare  = resolve version/tag only (run it early: fails fast before the
                 build if the tag already exists);
      finalize = build the notes and write the enabled records (reuses what
                 prepare resolved in this job);
      all      = both in one step.
    default: all
  kind:
    description: release | patch | testing. Picks the tag template and the previous-tag lookup.
    default: release
  id:
    description: Distinguishes several prepare/finalize pairs in the same job.
    default: default

  # ------------------------------------------------------------- records
  summary:
    description: Append the notes to the job summary ($GITHUB_STEP_SUMMARY).
    default: 'true'
  tag:
    description: none | annotated | lightweight. Annotated tags carry the notes as their message.
    default: annotated
  release:
    description: Publish a GitHub Release on the tag (requires tag != none).
    default: 'false'
  notes-file:
    description: Path to also write the rendered notes to (empty = a temp file, exposed as the notes-path output).
    default: ''

  # ------------------------------------------------------------- version
  version:
    description: Explicit version. Empty = read it from version-file.
    default: ''
  version-file:
    description: File to read the version from.
    default: pubspec.yaml
  version-format:
    description: auto | pubspec | package-json | plain | regex. auto infers it from the file name.
    default: auto
  version-regex:
    description: Perl regex whose first capture group is the version (version-format = regex).
    default: ''
  require-build-number:
    description: Require a +build suffix (e.g. 1.3.0+1).
    default: 'false'

  # ---------------------------------------------------------------- tags
  platform:
    description: Free-form label available as {{platform}} (e.g. Android, iOS, Web). Changes the default tag templates.
    default: ''
  tag-template-release:
    description: Tag template for kind=release. Default "{{platform}}-v{{version}}" ("v{{version}}" without platform).
    default: ''
  tag-template-patch:
    description: Tag template for kind=patch. Default "{{base_tag}}-patch{{patch}}".
    default: ''
  tag-template-testing:
    description: Tag template for kind=testing. Default "testing-{{platform}}-v{{version}}-run{{run}}".
    default: ''
  previous-tag-pattern:
    description: Glob for the previous tag (commits are listed since it). Default derived from the kind's template.
    default: ''
  on-existing:
    description: What to do when the tag already exists — fail | skip (no tag/release, notes still written) | overwrite.
    default: fail

  # --------------------------------------------------------------- notes
  title:
    description: Notes heading. Default "<platform> <kind>".
    default: ''
  note:
    description: Free-text note shown in the details table.
    default: ''
  details:
    description: Extra details-table rows, one "Label|Value" per line.
    default: ''
  sections:
    description: Comma-separated sections, in order — details, changelog, commits.
    default: details,changelog,commits
  language:
    description: en | es — built-in labels.
    default: en
  labels:
    description: Label overrides, one "key=Text" per line (see README for keys).
    default: ''
  template-file:
    description: Markdown template with {{placeholders}} replacing the built-in layout entirely.
    default: ''

  # ----------------------------------------------------------- changelog
  changelog-path:
    description: Keep a Changelog file. Missing file = section skipped.
    default: CHANGELOG.md
  changelog-section:
    description: auto (version section, else Unreleased; patches always Unreleased) | version | unreleased | <exact section name>.
    default: auto

  # ------------------------------------------------------------- commits
  commit-format:
    description: git log --pretty format for each commit line.
    default: '- %s (%h)'
  max-commits:
    description: Maximum commits listed (the rest are summarised as "+N more").
    default: '150'
  include-merges:
    description: Include merge commits.
    default: 'false'

  # ------------------------------------------------------------- release
  release-name:
    description: Release title. Default "<platform> v<version>" ("v<version>" without platform).
    default: ''
  files:
    description: Files to attach to the release, one glob per line.
    default: ''
  draft:
    description: Create the release as a draft.
    default: 'false'
  prerelease:
    description: Mark the release as a pre-release.
    default: 'false'
  make-latest:
    description: true | false | legacy — whether GitHub marks it as the latest release.
    default: 'true'
  token:
    description: Token for the release API.
    default: ${{ github.token }}

outputs:
  version:
    description: Full resolved version (e.g. 1.3.0+1).
    value: ${{ steps.run.outputs.version }}
  version-name:
    description: Version without the +build suffix.
    value: ${{ steps.run.outputs.version-name }}
  build-number:
    description: The +build suffix (empty if none).
    value: ${{ steps.run.outputs.build-number }}
  tag:
    description: Resolved tag name.
    value: ${{ steps.run.outputs.tag }}
  previous-tag:
    description: Tag the commit list starts from (empty = full history).
    value: ${{ steps.run.outputs.previous-tag }}
  tag-exists:
    description: Whether the tag already existed when prepare ran.
    value: ${{ steps.run.outputs.tag-exists }}
  tag-created:
    description: Whether finalize pushed the tag.
    value: ${{ steps.run.outputs.tag-created }}
  notes-path:
    description: Path of the rendered notes file.
    value: ${{ steps.run.outputs.notes-path }}
  notes:
    description: The rendered notes (Markdown).
    value: ${{ steps.run.outputs.notes }}
  release-url:
    description: URL of the published release (empty if none).
    value: ${{ steps.run.outputs.release-url }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        DR_MODE: ${{ inputs.mode }}
        DR_KIND: ${{ inputs.kind }}
        DR_ID: ${{ inputs.id }}
        DR_SUMMARY: ${{ inputs.summary }}
        DR_TAG: ${{ inputs.tag }}
        DR_RELEASE: ${{ inputs.release }}
        DR_NOTES_FILE: ${{ inputs.notes-file }}
        DR_VERSION: ${{ inputs.version }}
        DR_VERSION_FILE: ${{ inputs.version-file }}
        DR_VERSION_FORMAT: ${{ inputs.version-format }}
        DR_VERSION_REGEX: ${{ inputs.version-regex }}
        DR_REQUIRE_BUILD_NUMBER: ${{ inputs.require-build-number }}
        DR_PLATFORM: ${{ inputs.platform }}
        DR_TAG_TEMPLATE_RELEASE: ${{ inputs.tag-template-release }}
        DR_TAG_TEMPLATE_PATCH: ${{ inputs.tag-template-patch }}
        DR_TAG_TEMPLATE_TESTING: ${{ inputs.tag-template-testing }}
        DR_PREVIOUS_TAG_PATTERN: ${{ inputs.previous-tag-pattern }}
        DR_ON_EXISTING: ${{ inputs.on-existing }}
        DR_TITLE: ${{ inputs.title }}
        DR_NOTE: ${{ inputs.note }}
        DR_DETAILS: ${{ inputs.details }}
        DR_SECTIONS: ${{ inputs.sections }}
        DR_LANGUAGE: ${{ inputs.language }}
        DR_LABELS: ${{ inputs.labels }}
        DR_TEMPLATE_FILE: ${{ inputs.template-file }}
        DR_CHANGELOG_PATH: ${{ inputs.changelog-path }}
        DR_CHANGELOG_SECTION: ${{ inputs.changelog-section }}
        DR_COMMIT_FORMAT: ${{ inputs.commit-format }}
        DR_MAX_COMMITS: ${{ inputs.max-commits }}
        DR_INCLUDE_MERGES: ${{ inputs.include-merges }}
        DR_RELEASE_NAME: ${{ inputs.release-name }}
        DR_FILES: ${{ inputs.files }}
        DR_DRAFT: ${{ inputs.draft }}
        DR_PRERELEASE: ${{ inputs.prerelease }}
        DR_MAKE_LATEST: ${{ inputs.make-latest }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/src/main.sh"

branding:
  icon: tag
  color: blue
